name: Build Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_CPU: ${{ github.repository }}
  IMAGE_NAME_GPU: ${{ github.repository }}-gpu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # 修正 1: 使用 include 列表来定义矩阵项
        include:
          - name: cpu
            image: ${{ env.IMAGE_NAME_CPU }}
            # 修正 2: 将 args 定义为多行字符串，符合 build-push-action 的要求
            args: |
              COMMON_IMAGE=ubuntu:22.04
          - name: gpu
            image: ${{ env.IMAGE_NAME_GPU }}
            args: |
              COMMON_IMAGE=nvidia/cuda:12.1.0-base

    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v4

      - name: 🐧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 📦 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }} # 注意变量名变化
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: 🏗️ Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # 修正 3: 直接传递 args 变量
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
