  build_docker_gpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 更新版本

      - name: Set up QEMU # 修复：添加这一行，否则多平台构建会失败
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # 更新版本

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3 # 更新版本
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5 # 更新版本
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GPU }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5 # 更新版本
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64 # 修复：合并平台，不要写两次
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: "COMMON_IMAGE=nvidia/cuda:12.1.0-base" # 假设这是你的GPU基础镜像
